name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            dependencies: minimum pandas
            pandas: pandas==2.2.0
            # pandas 2.2.0 wheels require NumPy 1.x.
            numpy: numpy<2
          - python: "3.14"
            dependencies: latest pandas
            pandas: pandas
            numpy: numpy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        env:
          PANDAS_REQUIREMENT: ${{ matrix.pandas }}
          NUMPY_REQUIREMENT: ${{ matrix.numpy }}
        run: python -m pip install ".[dev]" "$PANDAS_REQUIREMENT" "$NUMPY_REQUIREMENT"
      - name: Run tests
        run: python -m pytest -q
