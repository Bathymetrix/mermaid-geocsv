name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            dependencies: minimum pandas and ObsPy
            pandas: pandas==2.2.0
            obspy: obspy==1.5.1
            # pandas 2.2.0 wheels require NumPy 1.x.
            numpy: numpy<2
          - python: "3.14"
            dependencies: latest pandas and ObsPy
            pandas: pandas
            obspy: obspy
            numpy: numpy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        env:
          PANDAS_REQUIREMENT: ${{ matrix.pandas }}
          NUMPY_REQUIREMENT: ${{ matrix.numpy }}
          OBSPY_REQUIREMENT: ${{ matrix.obspy }}
        run: python -m pip install ".[dev,obspy]" "$PANDAS_REQUIREMENT" "$NUMPY_REQUIREMENT" "$OBSPY_REQUIREMENT"
      - name: Run tests
        run: python -m pytest -q
      - name: Build and smoke-test installed wheel
        env:
          PANDAS_REQUIREMENT: ${{ matrix.pandas }}
          NUMPY_REQUIREMENT: ${{ matrix.numpy }}
          OBSPY_REQUIREMENT: ${{ matrix.obspy }}
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/geocsv-wheels" .
          python -m venv "$RUNNER_TEMP/geocsv-wheel-env"
          wheel_python="$RUNNER_TEMP/geocsv-wheel-env/bin/python"
          "$wheel_python" -m pip install "$RUNNER_TEMP"/geocsv-wheels/*.whl "$PANDAS_REQUIREMENT" "$NUMPY_REQUIREMENT" "$OBSPY_REQUIREMENT"
          cd "$RUNNER_TEMP"
          "$wheel_python" -I "$GITHUB_WORKSPACE/scripts/check_wheel.py" "$GITHUB_WORKSPACE/data/fixtures/association"
